<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Curto-Circuito</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div id="game-container">

    <!-- Canvas do jogo -->
    <canvas
      id="gameCanvas"
      width="800"
      height="600">
    </canvas>

    <!-- HUD -->
    <div id="hud">

      <div class="hud-item">
        Vida: <span id="vida">100</span>
      </div>

      <div class="hud-item">
        Pontos: <span id="pontos">0</span>
      </div>

      <div class="hud-item">
        Moedas: <span id="moedas">0</span>
      </div>

    </div>

    <!-- Tela de Game Over -->
    <div id="gameover" class="oculto">
      <h1>GAME OVER</h1>

      <p>
        Pontuação final:
        <span id="pontos-finais">0</span>
      </p>
    </div>

  </div>

  <script type="module" src="src/main.js"></script>

</body>

</html>
